  <text x="270" y="636" text-anchor="middle" class="node-meta">TransferConsumer</text>

  <g filter="url(#shadow)">
    <rect x="440" y="575" width="220" height="96" rx="16" fill="#FAFBFC" stroke="#C3CDD8" stroke-width="1.5" stroke-dasharray="7 6"/>
  </g>
  <text x="550" y="610" text-anchor="middle" class="node-title">동시성 충돌 재시도</text>

  <text x="1165" y="759" text-anchor="middle" class="node-meta">TransferLedger · SUCCESS</text>

  <path d="M370 623 H440" class="blue-line"/>
  <path d="M660 623 H730" class="blue-line"/>
  <path d="M940 623 H1030" class="blue-line"/>
  <path d="M1155 628 H1175" class="gray-line"/>
  <path d="M1235 670 V690 H1165 V705" class="blue-line"/>

  <rect x="70" y="820" width="1260" height="48" rx="12" fill="#FFFFFF" stroke="#E1E5EA"/>
  <circle cx="94" cy="844" r="5" fill="#5B82C4"/>
  <text x="110" y="849" class="small">파란 실선: 정상 처리 경로</text>
  <line x1="330" y1="844" x2="365" y2="844" stroke="#9AA5B1" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="380" y="849" class="small">회색 점선: 발행 실패·재시도 경로</text>
  <rect x="675" y="834" width="18" height="18" rx="4" fill="#F5F8FD" stroke="#AFC6EC" stroke-dasharray="4 3"/>
  <text x="705" y="849" class="small">연한 파란 영역: 동일 DB 트랜잭션</text>

  <text x="1092" y="639" text-anchor="middle" class="node-meta">withdraw / deposit</text>

  <g filter="url(#shadow)">
    <rect x="1175" y="585" width="120" height="85" rx="16" fill="#F1F6FF" stroke="#ABC5F2" stroke-width="1.5"/>
  </g>

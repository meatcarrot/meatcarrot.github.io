  <text x="1155" y="379" text-anchor="middle" class="node-meta-dark">transfer-topic</text>

  <g filter="url(#shadow)">
    <rect x="775" y="340" width="210" height="92" rx="16" fill="#FAFBFC" stroke="#C3CDD8" stroke-width="1.5" stroke-dasharray="7 6"/>

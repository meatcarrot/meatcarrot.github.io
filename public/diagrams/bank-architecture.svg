  <text x="880" y="374" text-anchor="middle" class="node-title">PENDING 상태 유지</text>
  <text x="880" y="397" text-anchor="middle" class="node-meta">5초마다 재발행 시도</text>

  <path d="M240 208 H300" class="blue-line"/>
  <path d="M510 193 H555 V221 H610" class="blue-line"/>
  <path d="M510 223 H545 V285 H785 V221 H805" class="blue-line"/>

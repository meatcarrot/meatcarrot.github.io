<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B82C4"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA5B1"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <style>
      .title { font: 700 26px "Pretendard", "Noto Sans KR", sans-serif; fill:#1F2937; }
      .section { font: 700 18px "Pretendard", "Noto Sans KR", sans-serif; fill:#2563EB; }
      .node-title { font: 700 17px "Pretendard", "Noto Sans KR", sans-serif; fill:#20262E; }
      .node-meta { font: 500 12px "SFMono-Regular", Consolas, monospace; fill:#778391; }
      .node-title-dark { font: 700 17px "Pretendard", "Noto Sans KR", sans-serif; fill:#FFFFFF; }
      .node-meta-dark { font: 500 12px "SFMono-Regular", Consolas, monospace; fill:#D7DEE8; }
      .small { font: 600 12px "Pretendard", "Noto Sans KR", sans-serif; fill:#64748B; }
      .tiny { font: 600 11px "Pretendard", "Noto Sans KR", sans-serif; fill:#64748B; }
      .boundary-label { font: 700 12px "Pretendard", "Noto Sans KR", sans-serif; fill:#4F6FA8; }
      .caption { font: 500 14px "Pretendard", "Noto Sans KR", sans-serif; fill:#5B6470; }
      .blue-line { stroke:#5B82C4; stroke-width:2.2; fill:none; marker-end:url(#arrow-blue); }
      .gray-line { stroke:#AEB7C1; stroke-width:1.8; fill:none; marker-end:url(#arrow-gray); }
      .dash-line { stroke:#9AA5B1; stroke-width:1.8; fill:none; stroke-dasharray:8 8; marker-end:url(#arrow-gray); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#FBFBFA"/>
  <text x="70" y="55" class="title">Kafka 기반 송금 시스템 · 처리 흐름</text>
  <text x="70" y="83" class="caption">요청 기록과 메시지 발행, 실제 계좌 반영을 분리해 실패 시 복구 가능한 구조로 구성</text>

  <text x="70" y="125" class="section">01  송금 요청 기록 · 이벤트 발행</text>
  <text x="70" y="525" class="section">02  실제 송금 처리</text>

  <g filter="url(#shadow)">

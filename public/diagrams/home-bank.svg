<svg xmlns="http://www.w3.org/2000/svg" width="600" height="170" viewBox="0 0 600 170">

  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#5B82C4"/>
    </marker>
    <style>
      .t{font:600 14px "Pretendard Variable","Noto Sans KR",sans-serif;fill:#20262E}
      .m{font:500 10px "Pretendard Variable","Noto Sans KR",sans-serif;fill:#64748B}
